name: Cross-Compiler Qualification (P2-XCC)

on:
  push:
    branches:
      - main
      - 'qualification/**'
      - 'remediation/**'
      - 'refactor/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. GCC / Linux Qualification
  # ============================================================================
  gcc-linux:
    name: GCC / Linux (ubuntu-latest)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      CC: gcc
      CXX: g++
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify CI Pipeline Gate Semantics (VRT-06 Self-Test)
        run: |
          set -euo pipefail
          python3 tools/ci/verify_pipeline_gate.py

      - name: Capture Environment Identity (Phase 5)
        run: |
          set -euo pipefail
          mkdir -p artifacts-gcc
          {
            echo "=== Host Environment ==="
            uname -a
            echo "=== C Compiler ==="
            gcc --version
            echo "=== C++ Compiler ==="
            g++ --version
            echo "=== CMake ==="
            cmake --version
            echo "=== Git SHA ==="
            git rev-parse HEAD
          } | tee artifacts-gcc/environment.txt

      - name: Phase 10 — GCC Debug Build & Test
        run: |
          set -euo pipefail
          cmake \
            -S . \
            -B build-gcc-debug \
            -DCMAKE_BUILD_TYPE=Debug \
            -DVECTORIS_ENABLE_ASAN=OFF \
            -DVECTORIS_ENABLE_UBSAN=OFF \
            -DVECTORIS_ENABLE_COVERAGE=OFF \
            -DVECTORIS_ENABLE_STATIC_ANALYSIS=OFF \
            | tee artifacts-gcc/configure-debug.log
          cmake --build build-gcc-debug --parallel 2>&1 | tee artifacts-gcc/build-debug.log
          ctest --test-dir build-gcc-debug --output-on-failure 2>&1 | tee artifacts-gcc/test-debug.log

      - name: Phase 11 — GCC Header Isolation
        run: |
          set -euo pipefail
          cmake --build build-gcc-debug --target VectorisNumerics_HeaderIsolation VectorisDynamics_HeaderIsolation --parallel 2>&1 | tee artifacts-gcc/header-isolation.log

      - name: Phase 12 — GCC Release Build & Test
        run: |
          set -euo pipefail
          cmake \
            -S . \
            -B build-gcc-release \
            -DCMAKE_BUILD_TYPE=Release \
            -DVECTORIS_ENABLE_ASAN=OFF \
            -DVECTORIS_ENABLE_UBSAN=OFF \
            -DVECTORIS_ENABLE_COVERAGE=OFF \
            -DVECTORIS_ENABLE_STATIC_ANALYSIS=OFF \
            | tee artifacts-gcc/configure-release.log
          cmake --build build-gcc-release --parallel 2>&1 | tee artifacts-gcc/build-release.log
          ctest --test-dir build-gcc-release --output-on-failure 2>&1 | tee artifacts-gcc/test-release.log

      - name: Upload GCC Qualification Artifacts (Phase 34)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcc-linux-qualification-logs
          path: artifacts-gcc/

  # ============================================================================
  # 2. LLVM Clang / Linux Qualification
  # ============================================================================
  clang-linux:
    name: LLVM Clang / Linux (ubuntu-latest)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Capture Environment Identity (Phase 5, Phase 13)
        run: |
          set -euo pipefail
          mkdir -p artifacts-clang
          {
            echo "=== Host Environment ==="
            uname -a
            echo "=== C Compiler ==="
            clang --version
            echo "=== C++ Compiler ==="
            clang++ --version
            echo "=== CMake ==="
            cmake --version
            echo "=== Git SHA ==="
            git rev-parse HEAD
          } | tee artifacts-clang/environment.txt

      - name: Phase 14 — LLVM Clang Debug Build & Test
        run: |
          set -euo pipefail
          cmake \
            -S . \
            -B build-clang-debug \
            -DCMAKE_BUILD_TYPE=Debug \
            -DVECTORIS_ENABLE_ASAN=OFF \
            -DVECTORIS_ENABLE_UBSAN=OFF \
            -DVECTORIS_ENABLE_COVERAGE=OFF \
            -DVECTORIS_ENABLE_STATIC_ANALYSIS=OFF \
            | tee artifacts-clang/configure-debug.log
          cmake --build build-clang-debug --parallel 2>&1 | tee artifacts-clang/build-debug.log
          ctest --test-dir build-clang-debug --output-on-failure 2>&1 | tee artifacts-clang/test-debug.log

      - name: Phase 15 — LLVM Clang Header Isolation
        run: |
          set -euo pipefail
          cmake --build build-clang-debug --target VectorisNumerics_HeaderIsolation VectorisDynamics_HeaderIsolation --parallel 2>&1 | tee artifacts-clang/header-isolation.log

      - name: Phase 16 — LLVM Clang Release Build & Test
        run: |
          set -euo pipefail
          cmake \
            -S . \
            -B build-clang-release \
            -DCMAKE_BUILD_TYPE=Release \
            -DVECTORIS_ENABLE_ASAN=OFF \
            -DVECTORIS_ENABLE_UBSAN=OFF \
            -DVECTORIS_ENABLE_COVERAGE=OFF \
            -DVECTORIS_ENABLE_STATIC_ANALYSIS=OFF \
            | tee artifacts-clang/configure-release.log
          cmake --build build-clang-release --parallel 2>&1 | tee artifacts-clang/build-release.log
          ctest --test-dir build-clang-release --output-on-failure 2>&1 | tee artifacts-clang/test-release.log

      - name: Upload LLVM Clang Qualification Artifacts (Phase 34)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-linux-qualification-logs
          path: artifacts-clang/

  # ============================================================================
  # 3. MSVC / Windows Qualification
  # ============================================================================
  msvc-windows:
    name: Windows MSVC x64 (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Capture Environment Identity (Phase 5, Phase 17)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts-msvc
          $envLog = @"
          === Windows System Info ===
          $([System.Environment]::OSVersion.ToString())
          === Runner Image ===
          ImageOS=$env:ImageOS
          ImageVersion=$env:ImageVersion
          === Process Architecture ===
          $env:PROCESSOR_ARCHITECTURE
          Is64BitProcess=$([System.Environment]::Is64BitProcess)
          === MSVC Compiler ===
          $(& cl.exe 2>&1 | Out-String)
          === CMake ===
          $(& cmake.exe --version | Out-String)
          === Git SHA ===
          $(& git.exe rev-parse HEAD | Out-String)
          "@
          $envLog | Out-File -FilePath artifacts-msvc/environment.txt -Encoding utf8
          Write-Host $envLog

      - name: Phase 18 — Configure MSVC
        shell: pwsh
        run: |
          Write-Host "=== Available Generators ==="
          & cmake.exe --help
          Write-Host "=== Installed VS Instances ==="
          & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -all -products *
          # Try default or detected generator
          & cmake.exe `
            -S . `
            -B build-msvc `
            -DVECTORIS_ENABLE_ASAN=OFF `
            -DVECTORIS_ENABLE_UBSAN=OFF `
            -DVECTORIS_ENABLE_COVERAGE=OFF `
            -DVECTORIS_ENABLE_STATIC_ANALYSIS=OFF `
            *>&1 | Tee-Object -FilePath artifacts-msvc/configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record Selected CMake Generator
        shell: pwsh
        run: |
          $cache = Get-Content build-msvc/CMakeCache.txt
          $generatorLine = $cache | Where-Object { $_ -match '^CMAKE_GENERATOR:INTERNAL=' } | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($generatorLine)) { throw "CMake generator was not recorded in CMakeCache.txt" }
          $platformLine = $cache | Where-Object { $_ -match '^CMAKE_GENERATOR_PLATFORM:INTERNAL=' } | Select-Object -First 1
          $instanceLine = $cache | Where-Object { $_ -match '^CMAKE_GENERATOR_INSTANCE:INTERNAL=' } | Select-Object -First 1
          $metadata = @"
          === Selected CMake Generator ===
          $($generatorLine -replace '^CMAKE_GENERATOR:INTERNAL=', '')
          $($platformLine -replace '^CMAKE_GENERATOR_PLATFORM:INTERNAL=', 'Platform=')
          $($instanceLine -replace '^CMAKE_GENERATOR_INSTANCE:INTERNAL=', 'Instance=')
          "@
          Add-Content -Path artifacts-msvc/environment.txt -Value $metadata -Encoding utf8
          Write-Host $metadata

      - name: Phase 19 — MSVC Debug Build & Test
        shell: pwsh
        run: |
          & cmake.exe --build build-msvc --config Debug --parallel *>&1 | Tee-Object -FilePath artifacts-msvc/build-debug.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ctest.exe --test-dir build-msvc -C Debug --output-on-failure *>&1 | Tee-Object -FilePath artifacts-msvc/test-debug.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Phase 20 — MSVC Header Isolation
        shell: pwsh
        run: |
          & cmake.exe --build build-msvc --config Debug --target VectorisNumerics_HeaderIsolation VectorisDynamics_HeaderIsolation --parallel *>&1 | Tee-Object -FilePath artifacts-msvc/header-isolation.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Phase 21 — MSVC Release Build & Test
        shell: pwsh
        run: |
          & cmake.exe --build build-msvc --config Release --parallel *>&1 | Tee-Object -FilePath artifacts-msvc/build-release.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ctest.exe --test-dir build-msvc -C Release --output-on-failure *>&1 | Tee-Object -FilePath artifacts-msvc/test-release.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload MSVC Qualification Artifacts (Phase 34)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msvc-windows-qualification-logs
          path: artifacts-msvc/

  # ============================================================================
  # 4. Dynamic Sanitizers / Linux (ASan, UBSan, ASan+UBSan)
  # ============================================================================
  sanitizers-linux:
    name: Sanitizers / Linux (ASan, UBSan, ASan+UBSan)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: "halt_on_error=1:abort_on_error=1"
      UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Negative Sanitizer Gates (VRT-05 Gate Self-Test)
        run: |
          set -euo pipefail
          python3 tools/sanitizers/verify_sanitizers_gate.py

      - name: ASan Build & Test
        run: |
          set -euo pipefail
          cmake \
            -S . \
            -B build-asan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DVECTORIS_ENABLE_ASAN=ON \
            -DVECTORIS_ENABLE_UBSAN=OFF \
            -DVECTORIS_ENABLE_COVERAGE=OFF \
            -DVECTORIS_ENABLE_STATIC_ANALYSIS=OFF
          cmake --build build-asan --parallel
          ctest --test-dir build-asan --output-on-failure

      - name: UBSan Build & Test
        run: |
          set -euo pipefail
          cmake \
            -S . \
            -B build-ubsan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DVECTORIS_ENABLE_ASAN=OFF \
            -DVECTORIS_ENABLE_UBSAN=ON \
            -DVECTORIS_ENABLE_COVERAGE=OFF \
            -DVECTORIS_ENABLE_STATIC_ANALYSIS=OFF
          cmake --build build-ubsan --parallel
          ctest --test-dir build-ubsan --output-on-failure

      - name: ASan+UBSan Build & Test
        run: |
          set -euo pipefail
          cmake \
            -S . \
            -B build-asan-ubsan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DVECTORIS_ENABLE_ASAN=ON \
            -DVECTORIS_ENABLE_UBSAN=ON \
            -DVECTORIS_ENABLE_COVERAGE=OFF \
            -DVECTORIS_ENABLE_STATIC_ANALYSIS=OFF
          cmake --build build-asan-ubsan --parallel
          ctest --test-dir build-asan-ubsan --output-on-failure

  # ============================================================================
  # 5. LLVM Source Coverage Gate / Linux (>=90.00% Raw Branch)
  # ============================================================================
  coverage-linux:
    name: Coverage Gate / Linux (LLVM Source Coverage >=90%)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install LLVM Tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y llvm

      - name: Configure Coverage Build
        run: |
          set -euo pipefail
          cmake \
            -S . \
            -B build-coverage \
            -DCMAKE_BUILD_TYPE=Debug \
            -DVECTORIS_ENABLE_ASAN=OFF \
            -DVECTORIS_ENABLE_UBSAN=OFF \
            -DVECTORIS_ENABLE_COVERAGE=ON \
            -DVECTORIS_ENABLE_STATIC_ANALYSIS=OFF

      - name: Build & Run VectorisNumerics_Coverage Target
        run: |
          set -euo pipefail
          cmake --build build-coverage --target VectorisNumerics_Coverage

  # ============================================================================
  # 6. Clang-Tidy Static Analysis / Linux (0 Production Diagnostics)
  # ============================================================================
  static-analysis-linux:
    name: Clang-Tidy Static Analysis / Linux (0 Production Diagnostics)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Clang-Tidy
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wget
          wget -q https://apt.llvm.org/llvm.sh -O llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y clang-tidy-22

      - name: Configure Static Analysis Build
        run: |
          set -euo pipefail
          mkdir -p artifacts-static
          {
            echo "=== clang-22 ==="
            clang-22 --version
            echo "=== clang++-22 ==="
            clang++-22 --version
            echo "=== clang-tidy-22 ==="
            clang-tidy-22 --version
            echo "=== Git SHA ==="
            git rev-parse HEAD
          } | tee artifacts-static/environment.txt
          CC=clang-22 CXX=clang++-22 cmake \
            -S . \
            -B build-sta \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DVECTORIS_CLANG_TIDY=/usr/bin/clang-tidy-22 \
            -DVECTORIS_CLANG_TIDY_MAJOR=22 \
            -DVECTORIS_ENABLE_ASAN=OFF \
            -DVECTORIS_ENABLE_UBSAN=OFF \
            -DVECTORIS_ENABLE_COVERAGE=OFF \
            -DVECTORIS_ENABLE_STATIC_ANALYSIS=ON \
            | tee artifacts-static/configure.log

      - name: Execute Clang-Tidy Target
        run: |
          set -euo pipefail
          mkdir -p artifacts-static
          cmake --build build-sta --target VectorisNumerics_ClangTidy 2>&1 | tee artifacts-static/clang-tidy-gate.log

      - name: Upload Clang-Tidy Qualification Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-qualification-logs
          path: artifacts-static/
